# 是否包含未匹配关键词的文章（来自所有源）
# false = 只保留匹配关键词的文章（推荐，更精准）
# true  = 保留所有文章（信息量大，可能噪音多）
include_unmatched: false

# 每次采集只保留最近多少小时的文章
lookback_hours: 8

# 每个领域最多保留多少篇文章送入 AI 摘要
max_articles_per_domain: 20
