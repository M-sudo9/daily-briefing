name: Daily Briefing

on:
  schedule:
    # UTC+8 时间: 8:00, 12:00, 16:00, 20:00, 22:00
    # 对应 UTC: 0:00, 4:00, 8:00, 12:00, 14:00
    - cron: "0 0,4,8,12,14 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 需要写入权限来提交简报文件

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/main.py

      - name: Commit and push
        run: |
          git config user.name "Briefing Bot"
          git config user.email "bot@briefing.local"
          git add docs/data/briefings/
          git commit -m "briefing: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
